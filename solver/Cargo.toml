[package]
name = "shortdeck-solver"
version = "0.1.0"
edition = "2021"

# No dependencies on purpose: `cargo run --release` works offline and cannot break
# because of a crate update. Parallelism uses std::thread (one thread per stack depth).

[[bin]]
name = "solve"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
