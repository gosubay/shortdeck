<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Short Deck HU Trainer</title>
<meta name="description" content="Heads-up short deck (6-plus) holdem trainer: play a solver bot, browse its strategy, learn the equities.">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2b3444;
  --ink:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
  --felt:#12402f; --felt2:#0d3325;
  --acc:#3fb950; --acc2:#2ea043; --warn:#d29922; --bad:#f85149; --good:#3fb950;
  --btn:#21262d; --btnh:#30363d; --gold:#e3b341;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h2{font-size:1.35rem;margin-top:1.8em;border-bottom:1px solid var(--line);padding-bottom:.35em}
h3{font-size:1.08rem;margin-top:1.5em;color:var(--gold)}
p{margin:0 0 .9em}
a{color:#58a6ff}
code,kbd{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em;
  background:var(--panel2);padding:.12em .38em;border-radius:4px}
ul,ol{margin:0 0 1em;padding-left:1.3em}
li{margin:.3em 0}

/* ---------- shell ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 12px}
header.top{
  position:sticky;top:0;z-index:50;background:rgba(13,17,23,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.brand{font-weight:700;font-size:1rem;letter-spacing:.2px;white-space:nowrap}
.brand span{color:var(--acc)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;background:none;border:none;color:var(--dim);font:inherit;font-weight:600;
  padding:9px 13px;border-radius:8px 8px 0 0;cursor:pointer;border-bottom:2px solid transparent;
  font-size:.92rem;white-space:nowrap;
}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);background:var(--panel)}
.panel{display:none;padding:14px 0 60px}
.panel.on{display:block}

/* ---------- HUD ---------- */
.hud{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:4px 9px;text-align:right;min-width:74px}
.stat .k{font-size:.62rem;color:var(--dim2);text-transform:uppercase;letter-spacing:.6px;
  display:block;line-height:1.3}
.stat .v{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.v.up{color:var(--good)} .v.down{color:var(--bad)}

/* ---------- table ---------- */
.felt{
  background:radial-gradient(ellipse at 50% 42%,var(--felt) 0%,var(--felt2) 72%,#08251b 100%);
  border:1px solid #1d5a42;border-radius:16px;padding:14px 12px;position:relative;
  min-height:430px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
}
.seat{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.nameplate{
  background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.13);border-radius:9px;
  padding:5px 11px;min-width:128px;text-align:center;
}
.nameplate .nm{font-size:.72rem;color:#9fd8bf;letter-spacing:.4px;text-transform:uppercase}
.nameplate .st{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.nameplate.act{border-color:var(--gold);box-shadow:0 0 0 2px rgba(227,179,65,.28)}
.btnchip{background:var(--gold);color:#2a1d00;font-weight:800;font-size:.66rem;
  border-radius:999px;padding:2px 7px;letter-spacing:.4px}
.chips{color:#ffe9a8;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem;
  background:rgba(0,0,0,.35);border-radius:999px;padding:2px 10px;min-height:22px;
  display:inline-block}
.chips:empty{display:none}
.middle{display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 0}
.potline{font-size:.82rem;color:#9fd8bf;letter-spacing:.5px;text-transform:uppercase}
.potval{font-size:1.5rem;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.board{display:flex;gap:6px;min-height:76px;align-items:center;justify-content:center;flex-wrap:wrap}
.msg{min-height:22px;text-align:center;color:#ffe9a8;font-weight:600;font-size:.95rem}

/* ---------- cards ---------- */
.card{
  width:50px;height:70px;border-radius:7px;background:#fbfcfd;color:#111;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;box-shadow:0 2px 7px rgba(0,0,0,.45);position:relative;flex:0 0 auto;
  border:1px solid #d3d8de;
}
.card .r{font-size:1.32rem;line-height:1}
.card .s{font-size:1.05rem;line-height:1}
.card.red{color:#d21f3c} .card.blk{color:#111}
.card.grn{color:#118f52} .card.blu{color:#1667c4}
.card.back{background:repeating-linear-gradient(45deg,#2a4a8a,#2a4a8a 5px,#1e3a72 5px,#1e3a72 10px);
  border-color:#16294f}
.card.sm{width:36px;height:50px}.card.sm .r{font-size:.95rem}.card.sm .s{font-size:.78rem}
.card.win{outline:2px solid var(--gold);outline-offset:1px}

/* ---------- controls ---------- */
.controls{margin-top:12px}
.actrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.btn{
  background:var(--btn);border:1px solid var(--line);color:var(--ink);font:inherit;
  font-weight:650;padding:11px 15px;border-radius:9px;cursor:pointer;flex:1 1 auto;
  min-width:88px;transition:background .12s,border-color .12s;font-size:.95rem;
}
.btn:hover:not(:disabled){background:var(--btnh)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.fold{border-color:#5c2b2b}.btn.fold:hover:not(:disabled){background:#3d1f1f}
.btn.call{border-color:#2d4a66}.btn.call:hover:not(:disabled){background:#1d3348}
.btn.raise{background:var(--acc2);border-color:var(--acc);color:#04170a}
.btn.raise:hover:not(:disabled){background:var(--acc)}
.btn.sm{padding:7px 11px;font-size:.85rem;min-width:0;flex:0 0 auto;font-weight:600}
.btn.ghost{background:none}
.sizerow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sizerow input[type=number],select{
  background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:inherit;
  padding:9px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.sizerow input[type=number]{width:100px}
.log{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  height:150px;overflow-y:auto;font-size:.85rem;line-height:1.5;margin-top:12px}
.log div{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.log .hero{color:#79c0ff}.log .bot{color:#ffa657}
.log .sys{color:var(--dim2)}.log .res{color:var(--gold);font-weight:600}

/* ---------- generic ---------- */
.note{background:var(--panel);border-left:3px solid var(--acc);padding:11px 14px;
  border-radius:0 8px 8px 0;margin:1em 0;font-size:.93rem}
.note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--bad)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.cardbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.cardbox h4{margin:0 0 .4em;color:var(--gold);font-size:.95rem}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.8em 0}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;font-size:.76rem;text-transform:uppercase;
   letter-spacing:.5px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--panel)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.74rem;
  font-weight:700;letter-spacing:.3px}
.pill.ok{background:rgba(63,185,80,.16);color:var(--acc)}
.pill.pend{background:rgba(210,153,34,.16);color:var(--warn)}
.pill.err{background:rgba(248,81,73,.16);color:var(--bad)}
.muted{color:var(--dim);font-size:.9rem}
.eqbar{display:flex;height:24px;border-radius:6px;overflow:hidden;font-size:.75rem;
  font-weight:700;min-width:170px}
.eqbar b{display:flex;align-items:center;justify-content:center;color:#04170a;
  overflow:hidden;white-space:nowrap}
.eqbar .a{background:#3fb950}.eqbar .b{background:#58a6ff}.eqbar .t{background:#6e7681}
.rankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
.rankcell{background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:6px 7px;font-size:.8rem;display:flex;justify-content:space-between;gap:6px}
.rankcell b{font-variant-numeric:tabular-nums}
@media(max-width:640px){
  .card{width:42px;height:60px}.card .r{font-size:1.1rem}.card .s{font-size:.9rem}
  .felt{min-height:390px;padding:11px 8px}
  .btn{padding:12px 10px;font-size:.9rem;min-width:72px}
  .stat{min-width:0;padding:3px 7px}.stat .v{font-size:.85rem}
  h2{font-size:1.18rem}
  .hud{width:100%;justify-content:space-between;margin-left:0}
}
</style>
</head>
<body>
